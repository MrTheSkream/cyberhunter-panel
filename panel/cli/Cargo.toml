[package]
name = "dockpanel"
version = "3.0.0-rc.4"
license = "AGPL-3.0-only"
edition = "2024"
description = "CLI for CyberHunter - Panel - self-hosted server management"

[[bin]]
name = "dockpanel"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
tokio = { version = "1", features = ["full", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
